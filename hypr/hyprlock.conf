# ~/.config/hypr/hyprlock.conf
#
# Plain config, works with `hyprlock` directly or through scripts/lock.sh.
# Paths are absolute because hyprlock doesn't reliably expand ~ or $HOME.

$font = JetBrainsMono Nerd Font

# ---- knobs ----
# blur: 0 = no blur, higher = blurrier
$blur_passes = 3
# blur radius per pass
$blur_size = 8

background {
    monitor =
    # soft link maintained by scripts/wallpaper.sh (always the active wallpaper)
    path = /home/kinyanzui/Pictures/Wallpapers/current
    # fallback colour if the wallpaper can't be loaded
    color = rgb(15, 20, 22)

    blur_passes = $blur_passes
    blur_size = $blur_size
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# ---- centre of the screen: music disc ----
# scripts/lock-disc-daemon.sh (started by scripts/lock.sh) pre-renders one turn of the disc and
# pokes hyprlock ~25 times a second; reload_time = 0 means "reload the image on that poke" and
# scripts/lock-disc.sh answers with the frame that matches the current time.
# It turns while music plays, stops on pause, and disappears when nothing plays.
# Works with a bare `hyprlock` too: the hidden label below starts the daemon.
image {
    monitor =
    # placeholder for the first moment; lock-disc.sh takes over from the first poke
    path = /home/kinyanzui/.cache/hypr/disc/empty.png
    # keep in sync with SIZE in scripts/lock-disc-daemon.sh
    size = 300
    reload_time = 0
    reload_cmd = /home/kinyanzui/.config/hypr/scripts/lock-disc.sh
    position = 0, 0
    halign = center
    valign = center
}

# ---- hidden helper: starts scripts/lock-disc-daemon.sh once when hyprlock starts ----
# The command returns at once and prints nothing, so the label stays invisible.
# (the huge update interval just means "don't repeat")
label {
    monitor =
    text = cmd[update:3600000] /home/kinyanzui/.config/hypr/scripts/lock-disc-daemon.sh --autostart
    color = rgba(0, 0, 0, 0)
    font_size = 1
    position = 0, 0
    halign = center
    valign = center
}

# ---- login box, bottom centre ----
# panel behind the field
shape {
    monitor =
    size = 520, 76
    position = 0, 85
    halign = center
    valign = bottom
    rounding = 20
    color = rgba(27, 32, 35, 0.85)
    border_size = 1
    border_color = rgba(64, 72, 76, 1.0)
}

input-field {
    monitor =
    size = 480, 40
    position = 0, 103
    halign = center
    valign = bottom

    rounding = 14
    outline_thickness = 1
    outer_color = rgb(64, 72, 76)
    inner_color = rgb(15, 20, 22)
    font_color = rgb(222, 227, 230)
    check_color = rgb(136, 209, 236)
    fail_color = rgb(255, 180, 171)
    font_family = $font
    placeholder_text = Password
    # keep the slot visible when nothing is typed
    fade_on_empty = false
}
